<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StockEx</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="auth-page">
    
    <div class="login-card">
        <div class="login-header">
            <h1><i class="bi bi-archive-fill"></i> AlmoxControl</h1>
            <p>Por favor, insira suas credenciais para continuar.</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Endereço de E-mail</label>
                <input type="email" id="email" placeholder="voce@empresa.com" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Lembrar-me</label>
                </div>
                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>

    <script>
        // Adiciona um pouco de interatividade para simular o login
        document.getElementById('login-form').addEventListener('submit', function(event) {
            // Previne o comportamento padrão do formulário (que é recarregar a página)
            event.preventDefault();

            // Simula um login bem-sucedido
            // alert('Login realizado com sucesso! Redirecionando para o Dashboard...');
            
            // Em uma aplicação real, aqui você faria uma chamada para a API
            // e, se o login fosse válido, redirecionaria o usuário.
            
            // Redireciona o usuário para a página principal.
            window.location.href = 'index.html'; 
        });
    </script>
</body>
</html>
