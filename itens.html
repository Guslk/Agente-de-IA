<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockEx - Itens</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo"><i class="bi bi-archive-fill"></i> StockEx</div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
                    <li><a href="itens.html" class="active"><i class="bi bi-box-seam"></i> Itens</a></li>
                    <li><a href="movimentacoes.html"><i class="bi bi-arrow-down-up"></i> Movimentações</a></li>
                    <li><a href="fornecedores.html"><i class="bi bi-truck"></i> Fornecedores</a></li>
                    <li><a href="funcionarios.html"><i class="bi bi-people-fill"></i> Funcionários</a></li>
                    <li><a href="relatorios.html"><i class="bi bi-bar-chart-fill"></i> Relatórios</a></li>
                </ul>
            </nav>
        </aside>

        <header class="header">
            <h1 class="header-title">Gerenciamento de Itens</h1>
            <div class="user-profile">
                <span>Bem-vindo, João</span>
                <img src="https://i.pravatar.cc/40?u=joao" alt="Avatar">
            </div>
        </header>

        <main class="main-content">
            <div class="main-header">
                <h2>Todos os Itens Cadastrados</h2>
                <div class="action-buttons">
                    <button class="btn-entrada"><i class="bi bi-plus-circle-fill"></i> Adicionar Novo Item</button>
                </div>
            </div>
            <section class="inventory-table">
                <table>
                    <thead>
                        <tr>
                            <th>Nome do Item</th>
                            <th>Código de Barras</th>
                            <th>Qtd. Atual</th>
                            <th>Unidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="items-table-body">
                        </tbody>
                </table>
            </section>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const items = [
        { id_item: 1, nome: 'SSD NVMe 256GB', codigo_barras: '7890123456789', unidade_medida: 'unidade', quantidade_atual: 52 },
        { id_item: 2, nome: 'Memória RAM DDR4 8GB', codigo_barras: '7890123456790', unidade_medida: 'unidade', quantidade_atual: 14 },
        { id_item: 3, nome: 'Mouse Gamer Logitech G203', codigo_barras: '7890123456791', unidade_medida: 'unidade', quantidade_atual: 35 },
    ];

    const tableBody = document.getElementById('items-table-body');
    tableBody.innerHTML = '';
    items.forEach(item => {
        const row = `
            <tr>
                <td><strong>${item.nome}</strong></td>
                <td>${item.codigo_barras}</td>
                <td>${item.quantidade_atual}</td>
                <td>${item.unidade_medida}</td>
                <td>
                    <button title="Editar" style="border:none; background:none; cursor:pointer; color: var(--primary-color); font-size: 1.2rem;"><i class="bi bi-pencil-square"></i></button>
                    <button title="Excluir" style="border:none; background:none; cursor:pointer; color: var(--danger); font-size: 1.2rem;"><i class="bi bi-trash-fill"></i></button>
                </td>
            </tr>
        `;
        tableBody.innerHTML += row;
    });
});
</script>
</body>
</html>
