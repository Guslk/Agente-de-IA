<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | StockEx</title>

    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="auth-page">
    <div class="register-card">
        <div class="register-header">
            <h1><i class="bi bi-archive-fill"></i> StockEx</h1>
            <p>Crie uma nova conta de usuário no sistema.</p>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label for="fullname">Nome Completo</label>
                <input type="text" id="fullname" placeholder="Ex: João da Silva" required>
            </div>
            <div class="form-group">
                <label for="role">Cargo</label>
                <select id="role" required>
                    <option value="" disabled selected>Selecione um cargo</option>
                    <option value="estoquista">Estoquista</option>
                    <option value="assistente">Assistente de Logística</option>
                    <option value="almoxarife">Almoxarife</option>
                    <option value="gerente">Gerente</option>
                </select>
            </div>
            <div class="form-group">
                <label for="email">Endereço de E-mail</label>
                <input type="email" id="email" placeholder="voce@empresa.com" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Crie uma senha forte" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmar Senha</label>
                <input type="password" id="confirm-password" placeholder="Repita a senha" required>
            </div>
            
            <button type="submit" class="btn-register">Criar Conta</button>
        </form>

        <div class="login-link">
            <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Simples validação para verificar se as senhas coincidem
            if (password !== confirmPassword) {
                alert('As senhas não coincidem. Por favor, tente novamente.');
                return; // Impede o resto do código de rodar
            }

            // Simula um cadastro bem-sucedido
            alert('Cadastro realizado com sucesso! Você será redirecionado para a tela de login.');
            
            // Em uma aplicação real, aqui você faria uma chamada para a API de cadastro.
            // Após o sucesso, redireciona o usuário para a página de login.
            window.location.href = 'login.html'; 
        });
    </script>
    </div>
</body>
</html>
