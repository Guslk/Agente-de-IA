<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>StockEx - Funcionários</title>
    <style>:root {
            --primary-color: #3e4e88;    
            --background-color: #F4F7FA;
            --sidebar-bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --text-light: #777777;
            --border-color: #EAEAEA;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --success: #4CAF50;
            --warning: #FF9800;
            --danger: #F44336;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--background-color); color: var(--text-color); }

        /* 2. Estrutura e Layout */
        .container { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 70px 1fr; height: 100vh; grid-template-areas: "sidebar header" "sidebar main"; }
        .sidebar { grid-area: sidebar; background-color: var(--sidebar-bg); padding: 20px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .header { grid-area: header; background-color: var(--card-bg); padding: 0 30px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .main-content { grid-area: main; padding: 30px; overflow-y: auto; }
        
        /* 3. Componentes da UI */
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary-color); margin-bottom: 40px; }
        .logo i { margin-right: 10px; }
        .nav-menu ul { list-style: none; }
        .nav-menu li a { display: block; padding: 15px; border-radius: 8px; text-decoration: none; color: var(--text-light); font-weight: 500; margin-bottom: 10px; transition: all 0.3s ease; }
        .nav-menu li a i { margin-right: 15px; font-size: 1.2rem; }
        .nav-menu li a:hover, .nav-menu li a.active { background-color: var(--primary-color); color: white; }
        .header-title { font-size: 1.8rem; font-weight: 600; }
        .user-profile { display: flex; align-items: center; }
        .user-profile span { margin-right: 10px; font-weight: 500; }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .main-header h2 { font-size: 1.5rem; }
        .action-buttons button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .action-buttons .btn-entrada { background-color: var(--success); color: white; }
        .action-buttons .btn-saida { background-color: var(--danger); color: white; margin-left: 10px; }
        .action-buttons button:hover { opacity: 0.9; }

        /* Tabela */
        .inventory-table { background-color: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px var(--shadow-color); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 600; color: var(--text-light); font-size: 0.9rem; text-transform: uppercase; }
        td { font-weight: 500; }
        
        /* Pílulas de Status */
        .status-pill { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: white; text-align: center; }
        .status-ok { background-color: var(--success); }
        .status-low { background-color: var(--warning); }
        .status-empty { background-color: var(--danger); }
        
        /* 4. Estilos do Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); display: none; /* Inicia oculto */ justify-content: center; align-items: center; z-index: 1000; }
        .modal { background-color: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 800px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .modal-header h3 { font-size: 1.5rem; }
        .modal-header .close-button { font-size: 1.8rem; cursor: pointer; border: none; background: none; color: var(--text-light); }
        .modal-body .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; font-family: 'Poppins', sans-serif; }
        .items-section h4 { margin-bottom: 15px; }
        .items-entry-form { display: grid; grid-template-columns: 3fr 1fr 1fr auto; gap: 15px; align-items: flex-end; }
        .items-entry-form button { padding: 12px; background-color: var(--primary-color); color: white; }
        #added-items-table { margin-top: 20px; }
        .modal-footer { border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: 30px; text-align: right; }
        .btn-primary { background-color: var(--primary-color); color: white; padding: 12px 25px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }</style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo"><i class="bi bi-archive-fill"></i> StockEx</div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
                    <li><a href="itens.html"><i class="bi bi-box-seam"></i> Itens</a></li>
                    <li><a href="movimentacoes.html"><i class="bi bi-arrow-down-up"></i> Movimentações</a></li>
                    <li><a href="fornecedores.html"><i class="bi bi-truck"></i> Fornecedores</a></li>
                    <li><a href="funcionarios.html" class="active"><i class="bi bi-people-fill"></i> Funcionários</a></li>
                    <li><a href="relatorios.html"><i class="bi bi-bar-chart-fill"></i> Relatórios</a></li>
                </ul>
            </nav>
        </aside>

        <header class="header">
            <h1 class="header-title">Gerenciamento de Funcionários</h1>
            <div class="user-profile"><span>Bem-vindo, João</span><img src="https://i.pravatar.cc/40?u=joao" alt="Avatar"></div>
        </header>

        <main class="main-content">
            <div class="main-header">
                <h2>Todos os Funcionários Cadastrados</h2>
                <div class="action-buttons">
                    <button class="btn-entrada"><i class="bi bi-plus-circle-fill"></i> Adicionar Novo Funcionário</button>
                </div>
            </div>
            <section class="inventory-table">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Email</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="funcionarios-table-body"></tbody>
                </table>
            </section>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const funcionarios = [
        { id_funcionario: 1, nome: 'João da Silva', cargo: 'Almoxarife Chefe', email: 'joao.silva@empresa.com' },
        { id_funcionario: 2, nome: 'Maria Oliveira', cargo: 'Assistente de Logística', email: 'maria.oliveira@empresa.com' },
        { id_funcionario: 3, nome: 'Pedro Martins', cargo: 'Estoquista', email: 'pedro.martins@empresa.com' }
    ];

    const tableBody = document.getElementById('funcionarios-table-body');
    tableBody.innerHTML = '';
    funcionarios.forEach(f => {
        const row = `
            <tr>
                <td><strong>${f.nome}</strong></td>
                <td>${f.cargo}</td>
                <td>${f.email}</td>
                <td>
                    <button title="Editar" style="border:none; background:none; cursor:pointer; color: var(--primary-color); font-size: 1.2rem;"><i class="bi bi-pencil-square"></i></button>
                    <button title="Excluir" style="border:none; background:none; cursor:pointer; color: var(--danger); font-size: 1.2rem;"><i class="bi bi-trash-fill"></i></button>
                </td>
            </tr>
        `;
        tableBody.innerHTML += row;
    });
});
</script>
</body>
</html>
